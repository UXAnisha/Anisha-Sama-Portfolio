<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients & Patterns -->
    <linearGradient id="navBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D141C" />
      <stop offset="100%" stop-color="#2D0D14" />
    </linearGradient>

    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EBD8" />
      <stop offset="50%" stop-color="#EBE0C8" />
      <stop offset="100%" stop-color="#E5D6B8" />
    </linearGradient>

    <linearGradient id="innerCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF5E8" />
      <stop offset="100%" stop-color="#F4ECD8" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D379" />
      <stop offset="50%" stop-color="#D8B14E" />
      <stop offset="100%" stop-color="#B38A28" />
    </linearGradient>

    <linearGradient id="magShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(40,20,15,0.4)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.0)" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3D141C" flood-opacity="0.12" />
    </filter>

    <filter id="mag3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="16" stdDeviation="10" flood-color="#1A0508" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#paperBg)" />

  <!-- Architectural Sketch Watermark Lines Left (Clock Tower Sketch) -->
  <g opacity="0.18" stroke="#7A5E43" stroke-width="1.2" fill="none">
    <!-- Clock Tower Contour -->
    <path d="M 120 600 L 120 220 L 140 180 L 140 100 L 180 60 L 220 100 L 220 180 L 240 220 L 240 600 Z" />
    <path d="M 140 180 L 220 180 M 140 220 L 220 220 M 120 300 L 240 300 M 120 400 L 240 400 M 120 500 L 240 500" />
    <circle cx="180" cy="140" r="22" stroke-width="1.5" />
    <path d="M 180 122 L 180 140 L 192 140" />
    <!-- Tower Arches -->
    <path d="M 150 260 Q 180 240 210 260 L 210 300 L 150 300 Z" />
    <path d="M 150 360 Q 180 340 210 360 L 210 400 L 150 400 Z" />
    <path d="M 150 460 Q 180 440 210 460 L 210 500 L 150 500 Z" />
    <!-- Fine Hatching Lines -->
    <path d="M 60 600 L 60 350 Q 90 320 120 350 M 240 350 Q 270 320 300 350 L 300 600" />
  </g>

  <!-- Architectural Sketch Watermark Lines Right (Palace Dome Sketch) -->
  <g opacity="0.18" stroke="#7A5E43" stroke-width="1.2" fill="none">
    <!-- Palace Cupola Contour -->
    <path d="M 960 600 L 960 300 Q 1020 200 1080 300 L 1080 600 Z" />
    <path d="M 980 300 L 1060 300 M 960 400 L 1080 400 M 960 500 L 1080 500" />
    <path d="M 1020 200 L 1020 140 M 1010 140 L 1030 140" />
    <!-- Arches -->
    <path d="M 990 360 Q 1020 330 1050 360 L 1050 400 L 990 400 Z" />
    <path d="M 990 460 Q 1020 430 1050 460 L 1050 500 L 990 500 Z" />
    <!-- Surrounding Structures -->
    <path d="M 860 600 L 860 420 L 960 420 M 1080 420 L 1180 420 L 1180 600" />
  </g>

  <!-- TOP BURGUNDY NAVIGATION BAR -->
  <rect x="0" y="0" width="1200" height="52" fill="url(#navBarGrad)" />
  
  <g font-family="'Times New Roman', serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <text x="320" y="32" fill="#EAD9C2">HOME</text>
    <text x="420" y="32" fill="#EAD9C2">PROTECT</text>
    <text x="530" y="32" fill="#EAD9C2">PRESERVE</text>
    
    <!-- Active Highlight "PROMOTE" -->
    <text x="640" y="32" fill="#F3D379" font-weight="700">PROMOTE</text>
    <line x1="610" y1="38" x2="670" y2="38" stroke="#F3D379" stroke-width="2" />

    <text x="740" y="32" fill="#EAD9C2">SHOP</text>
    <text x="830" y="32" fill="#EAD9C2">CONTACT</text>

    <!-- User / Login -->
    <g transform="translate(920, 22)">
      <circle cx="8" cy="8" r="7" stroke="#EAD9C2" stroke-width="1.2" fill="none" />
      <circle cx="8" cy="6" r="2.5" fill="#EAD9C2" />
      <path d="M 3 13 C 3 10, 13 10, 13 13" stroke="#EAD9C2" stroke-width="1.2" fill="none" />
      <text x="22" y="11" fill="#EAD9C2" font-size="11" text-anchor="start">Log In</text>
    </g>
  </g>

  <!-- CENTER PARCHMENT CARD WITH SCALLOPED / STITCHED BORDER -->
  <g filter="url(#cardShadow)">
    <rect x="280" y="80" width="640" height="420" rx="8" fill="url(#innerCardBg)" stroke="#D8C7A5" stroke-width="1.5" />
    <rect x="286" y="86" width="628" height="408" rx="6" fill="none" stroke="#C4B08B" stroke-dasharray="4 3" stroke-width="1" opacity="0.7" />
  </g>

  <!-- CARD CONTENT -->
  <!-- Title & Flourish -->
  <text x="600" y="128" font-family="'Georgia', serif" font-size="30" fill="#3D141C" font-weight="400" text-anchor="middle" letter-spacing="0.5">
    Bhavnagar Heritage Magazine
  </text>
  
  <!-- Fine Ornamental Flourish Line -->
  <g stroke="#B89552" stroke-width="1" fill="none" opacity="0.8">
    <line x1="510" y1="144" x2="575" y2="144" />
    <circle cx="580" cy="144" r="2" fill="#B89552" />
    <path d="M 584 144 L 600 139 L 616 144 L 600 149 Z" fill="#B89552" />
    <circle cx="620" cy="144" r="2" fill="#B89552" />
    <line x1="625" y1="144" x2="690" y2="144" />
  </g>

  <!-- Subtitle -->
  <text x="600" y="166" font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#6B422B" text-anchor="middle">
    Stories that keep a city alive.
  </text>

  <!-- 3D MAGAZINE MOCKUP ON LEFT SIDE OF CARD -->
  <g transform="translate(390, 190)" filter="url(#mag3dShadow)">
    <!-- Magazine Base/Spine Perspective -->
    <path d="M 0 0 L 135 -12 L 135 240 L 0 252 Z" fill="#2A0B10" />
    
    <!-- Magazine Front Cover -->
    <rect x="0" y="0" width="135" height="250" rx="2" fill="#FAF5EB" stroke="#C2AC82" stroke-width="1" />
    
    <!-- Cover Banner Top -->
    <text x="67" y="24" font-family="'Georgia', serif" font-size="8" font-weight="bold" fill="#8C6827" text-anchor="middle" letter-spacing="1">BHAVNAGAR</text>
    <text x="67" y="44" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#3D141C" text-anchor="middle" letter-spacing="1">Heritage</text>

    <text x="67" y="54" font-family="'Arial', sans-serif" font-size="5" fill="#7A6242" text-anchor="middle">VOL 30 | ISSUE 25 | AUG 2026</text>
    <text x="67" y="60" font-family="'Arial', sans-serif" font-size="4" font-weight="bold" fill="#3D141C" text-anchor="middle" letter-spacing="0.5">PROTECT · PRESERVE · PROMOTE</text>

    <!-- Cover Collage Grid of Mini Covers -->
    <g transform="translate(22, 68)">
      <!-- Mini Cover Grid -->
      <rect x="0" y="0" width="26" height="34" fill="#3D141C" rx="1" />
      <rect x="30" y="0" width="26" height="34" fill="#7A221E" rx="1" />
      <rect x="60" y="0" width="26" height="34" fill="#234232" rx="1" />

      <rect x="15" y="20" width="26" height="34" fill="#8C5B27" rx="1" stroke="#FAF5EB" stroke-width="1" />
      <rect x="45" y="20" width="26" height="34" fill="#1C3854" rx="1" stroke="#FAF5EB" stroke-width="1" />

      <rect x="0" y="44" width="26" height="34" fill="#6B2E1E" rx="1" />
      <rect x="30" y="44" width="26" height="34" fill="#2E4A38" rx="1" />
      <rect x="60" y="44" width="26" height="34" fill="#5C2138" rx="1" />

      <rect x="15" y="66" width="26" height="34" fill="#1A3326" rx="1" stroke="#FAF5EB" stroke-width="1" />
      <rect x="45" y="66" width="26" height="34" fill="#8C3A27" rx="1" stroke="#FAF5EB" stroke-width="1" />
    </g>

    <!-- Gold Anniversary Ribbon at Bottom -->
    <rect x="-4" y="212" width="143" height="22" fill="url(#goldHighlight)" rx="2" />
    <text x="67" y="226" font-family="'Georgia', serif" font-size="10" font-weight="bold" fill="#21080C" text-anchor="middle" letter-spacing="1.5">2 YEARS ANNIVERSARY</text>
  </g>

  <!-- RIGHT SIDE HEADING IN CARD -->
  <g transform="translate(580, 250)">
    <text x="140" y="0" font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#3D141C" text-anchor="middle">
      Celebrating two
    </text>
    <text x="140" y="32" font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#3D141C" text-anchor="middle">
      years of Bhavnagar
    </text>
    <text x="140" y="64" font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#3D141C" text-anchor="middle">
      Heritage Magazine
    </text>
  </g>

  <!-- BOTTOM PARAGRAPH ON WARM PARCHMENT CANVAS -->
  <g font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#4A2E20" text-anchor="middle">
    <text x="600" y="555">
      A journey of preserving stories, people, places, and traditions that shape the city’s identity. This anniversary issue honors the voices
    </text>
    <text x="600" y="580">
      and memories that have brought Bhavnagar’s heritage to life, while looking ahead to the stories still waiting to be shared.
    </text>
  </g>

</svg>
