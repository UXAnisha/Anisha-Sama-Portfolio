<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Left Window Maroon Hero Texture -->
    <linearGradient id="maroonHero" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d0e14" />
      <stop offset="50%" stop-color="#320a0f" />
      <stop offset="100%" stop-color="#210508" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Clip Paths for Windows -->
    <clipPath id="leftWindowClip">
      <rect x="30" y="45" width="620" height="585" rx="10" />
    </clipPath>

    <clipPath id="rightWindowClip">
      <rect x="680" y="145" width="490" height="485" rx="10" />
    </clipPath>

    <clipPath id="leftWebClip">
      <rect x="30" y="85" width="620" height="545" />
    </clipPath>

    <clipPath id="rightWebClip">
      <rect x="680" y="185" width="490" height="445" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- ==================== LEFT BROWSER WINDOW ==================== -->
  <!-- Shadow & Outer Frame -->
  <rect x="28" y="43" width="624" height="589" rx="12" fill="none" stroke="#262626" stroke-width="1.5" />
  <rect x="30" y="45" width="620" height="585" rx="10" fill="#121212" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.8))" />

  <!-- Top Bar (Window Header) -->
  <rect x="30" y="45" width="620" height="40" fill="#1A1A1A" clip-path="url(#leftWindowClip)" />
  <circle cx="48" cy="65" r="4.5" fill="#EF4444" />
  <circle cx="62" cy="65" r="4.5" fill="#F59E0B" />
  <circle cx="76" cy="65" r="4.5" fill="#10B981" />

  <!-- Address Bar mockup -->
  <rect x="100" y="53" width="490" height="24" rx="12" fill="#0D0D0D" stroke="#262626" stroke-width="0.8" />
  <text x="345" y="69" fill="#737373" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">bhavnagarheritage.com</text>
  <circle cx="612" cy="65" r="1.5" fill="#737373" />
  <circle cx="618" cy="65" r="1.5" fill="#737373" />
  <circle cx="624" cy="65" r="1.5" fill="#737373" />

  <!-- Website Content Inside Left Window -->
  <g clip-path="url(#leftWebClip)">
    <!-- Hero Canvas (Burgundy) -->
    <rect x="30" y="85" width="620" height="545" fill="url(#maroonHero)" />

    <!-- Navigation Header -->
    <rect x="30" y="85" width="620" height="45" fill="#2d080c" opacity="0.6" />
    <g font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1">
      <text x="140" y="112" fill="#F5D77F">HOME</text>
      <line x1="125" y1="117" x2="155" y2="117" stroke="#F5D77F" stroke-width="1.5" />
      <text x="210" y="112" fill="#E5E5E5">PROTECT</text>
      <text x="285" y="112" fill="#E5E5E5">PRESERVE</text>
      <text x="360" y="112" fill="#E5E5E5">PROMOTE</text>
      <text x="435" y="112" fill="#E5E5E5">SHOP</text>
      <text x="500" y="112" fill="#E5E5E5">CONTACT</text>
      
      <!-- Log In -->
      <g transform="translate(560, 105)">
        <circle cx="0" cy="3" r="5" fill="none" stroke="#E5E5E5" stroke-width="1" />
        <path d="M -3 10 C -3 6 3 6 3 10" fill="none" stroke="#E5E5E5" stroke-width="1" />
        <text x="14" y="6" fill="#E5E5E5" font-size="8">Log In</text>
      </g>
    </g>

    <!-- Faint Palace Silhouette Background Pattern -->
    <g opacity="0.12" fill="none" stroke="#F5D77F" stroke-width="0.8">
      <!-- Palace Archways outline -->
      <path d="M 120 500 L 120 400 Q 150 370 180 400 L 180 500 M 180 500 L 180 400 Q 210 370 240 400 L 240 500 M 240 500 L 240 400 Q 270 370 300 400 L 300 500 M 300 500 L 300 400 Q 330 370 360 400 L 360 500 M 360 500 L 360 400 Q 390 370 420 400 L 420 500 M 420 500 L 420 400 Q 450 370 480 400 L 480 500 M 480 500 L 480 400 Q 510 370 540 400 L 540 500" />
      <rect x="110" y="380" width="440" height="20" />
      <path d="M 230 380 L 230 330 Q 340 290 450 330 L 450 380" />
    </g>

    <!-- Center Emblem: Golden Ornate Sun Logo -->
    <g transform="translate(340, 275)">
      <!-- Outer Sun Rays -->
      <g fill="none" stroke="url(#goldGradient)" stroke-width="1.8">
        <circle cx="0" cy="0" r="42" stroke-dasharray="3,3" />
        <!-- Flame/Ray Motifs -->
        <path d="M 0 -48 Q 5 -58 0 -68 Q -5 -58 0 -48 Z" fill="url(#goldGradient)" />
        <path d="M 0 48 Q 5 58 0 68 Q -5 58 0 48 Z" fill="url(#goldGradient)" />
        <path d="M -48 0 Q -58 5 -68 0 Q -58 -5 -48 0 Z" fill="url(#goldGradient)" />
        <path d="M 48 0 Q 58 5 68 0 Q 58 -5 48 0 Z" fill="url(#goldGradient)" />
        
        <path d="M -34 -34 Q -45 -45 -50 -35 Q -38 -30 -34 -34 Z" fill="url(#goldGradient)" />
        <path d="M 34 -34 Q 45 -45 50 -35 Q 38 -30 34 -34 Z" fill="url(#goldGradient)" />
        <path d="M -34 34 Q -45 45 -50 35 Q -38 30 -34 34 Z" fill="url(#goldGradient)" />
        <path d="M 34 34 Q 45 45 50 35 Q 38 30 34 34 Z" fill="url(#goldGradient)" />
      </g>

      <!-- Inner Archway Bridge & Waves Motif -->
      <g fill="none" stroke="url(#goldGradient)" stroke-width="1.5">
        <rect x="-26" y="-20" width="52" height="24" rx="2" />
        <path d="M -26 -8 L 26 -8" />
        <path d="M -18 -8 L -18 4 M -9 -8 L -9 4 M 0 -8 L 0 4 M 9 -8 L 9 4 M 18 -8 L 18 4" />
        <!-- Arches -->
        <path d="M -22 4 Q -18 -2 -14 4 M -13 4 Q -9 -2 -5 4 M -4 4 Q 0 -2 4 4 M 5 4 Q 9 -2 13 4 M 14 4 Q 18 -2 22 4" />
        <!-- Waves below -->
        <path d="M -24 14 Q -16 8 -8 14 Q 0 8 8 14 Q 16 8 24 14" />
        <path d="M -24 20 Q -16 14 -8 20 Q 0 14 8 20 Q 16 14 24 20" />
      </g>
    </g>

    <!-- Main Title Typography -->
    <text x="340" y="380" fill="#F8F6F0" font-family="Georgia, serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="4">BHAVNAGAR</text>
    <text x="340" y="412" fill="#F8F6F0" font-family="Georgia, serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="5">HERITAGE</text>

  </g>

  <!-- ==================== RIGHT BROWSER WINDOW ==================== -->
  <!-- Shadow & Outer Frame -->
  <rect x="678" y="143" width="494" height="489" rx="12" fill="none" stroke="#262626" stroke-width="1.5" />
  <rect x="680" y="145" width="490" height="485" rx="10" fill="#121212" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.85))" />

  <!-- Top Bar (Window Header) -->
  <rect x="680" y="145" width="490" height="40" fill="#1A1A1A" clip-path="url(#rightWindowClip)" />
  <circle cx="698" cy="165" r="4.5" fill="#EF4444" />
  <circle cx="712" cy="165" r="4.5" fill="#F59E0B" />
  <circle cx="726" cy="165" r="4.5" fill="#10B981" />

  <!-- Address Bar -->
  <rect x="750" y="153" width="370" height="24" rx="12" fill="#0D0D0D" stroke="#262626" stroke-width="0.8" />
  <text x="935" y="169" fill="#737373" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">bhavnagarheritage.com/explore</text>
  <circle cx="1142" cy="165" r="1.5" fill="#737373" />
  <circle cx="1148" cy="165" r="1.5" fill="#737373" />
  <circle cx="1154" cy="165" r="1.5" fill="#737373" />

  <!-- Website Content Inside Right Window -->
  <g clip-path="url(#rightWebClip)">
    <!-- Header -->
    <rect x="680" y="185" width="490" height="35" fill="#2d080c" />
    <g font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.8">
      <text x="735" y="206" fill="#E5E5E5">HOME</text>
      <text x="785" y="206" fill="#F5D77F">PROTECT</text>
      <line x1="772" y1="211" x2="798" y2="211" stroke="#F5D77F" stroke-width="1.2" />
      <text x="840" y="206" fill="#E5E5E5">PRESERVE</text>
      <text x="895" y="206" fill="#E5E5E5">PROMOTE</text>
      <text x="945" y="206" fill="#E5E5E5">SHOP</text>
      <text x="990" y="206" fill="#E5E5E5">CONTACT</text>
      <text x="1035" y="206" fill="#E5E5E5">CONTACT</text>

      <g transform="translate(1085, 200)">
        <circle cx="0" cy="2" r="4" fill="none" stroke="#E5E5E5" stroke-width="0.8" />
        <text x="10" y="5" fill="#E5E5E5" font-size="7">Log In</text>
      </g>
    </g>

    <!-- Split Cards Area -->
    <!-- Left Split: MONUMENTS Card -->
    <g transform="translate(680, 220)">
      <!-- Background / Photo representation -->
      <rect x="0" y="0" width="245" height="410" fill="#2A3D30" />
      <!-- Sky Gradient -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8BB2CA" />
        <stop offset="60%" stop-color="#C5DCE8" />
        <stop offset="100%" stop-color="#324B36" />
      </linearGradient>
      <rect x="0" y="0" width="245" height="260" fill="url(#skyGrad)" />

      <!-- Lush Trees Greenery -->
      <ellipse cx="60" cy="300" rx="70" ry="90" fill="#1C3823" />
      <ellipse cx="185" cy="300" rx="70" ry="90" fill="#1C3823" />
      <ellipse cx="122" cy="320" rx="90" ry="80" fill="#142B1A" />

      <!-- Chhatri Marble Pavilion Monument Structure -->
      <g transform="translate(122, 170)">
        <!-- Dome Top -->
        <path d="M 0 -70 Q -25 -20 -30 0 L 30 0 Q 25 -20 0 -70 Z" fill="#F4F1EA" />
        <circle cx="0" cy="-73" r="3" fill="#D4AF37" />
        <!-- Cornice -->
        <rect x="-35" y="0" width="70" height="8" fill="#E5E0D8" />
        <!-- Pillars -->
        <rect x="-28" y="8" width="6" height="50" fill="#F4F1EA" />
        <rect x="-12" y="8" width="5" height="50" fill="#E8E3DA" />
        <rect x="7" y="8" width="5" height="50" fill="#E8E3DA" />
        <rect x="22" y="8" width="6" height="50" fill="#F4F1EA" />
        <!-- Base / Plinth -->
        <rect x="-40" y="58" width="80" height="15" fill="#D2CCC0" />
        <rect x="-50" y="73" width="100" height="60" fill="#BDB5A6" />
      </g>

      <!-- Pathway leading to monument -->
      <path d="M 100 410 L 115 310 L 130 310 L 145 410 Z" fill="#D9D2C5" />

      <!-- Text Overlay: MONUMENTS -->
      <text x="122" y="270" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7" font-weight="700" letter-spacing="2" text-anchor="middle" opacity="0.85">HERITAGE</text>
      <text x="122" y="295" fill="#FFFFFF" font-family="Georgia, serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">MONUMENTS</text>
    </g>

    <!-- Right Split: CRAFTS Card -->
    <g transform="translate(925, 220)">
      <!-- Background / Photo of Embroidery Craft -->
      <rect x="0" y="0" width="245" height="410" fill="#182030" />
      <!-- Navy Fabric Texture -->
      <rect x="0" y="0" width="245" height="410" fill="#192841" />

      <!-- Embroidery Hoop Wooden Ring -->
      <circle cx="122" cy="180" r="105" fill="none" stroke="#D29953" stroke-width="12" />
      <circle cx="122" cy="180" r="99" fill="none" stroke="#8F5E24" stroke-width="2" />

      <!-- Yellow Stitched Floral Embroidery Motif -->
      <g transform="translate(160, 190)">
        <circle cx="0" cy="0" r="14" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
        <circle cx="0" cy="0" r="5" fill="#78350F" />
        <!-- Thread lines -->
        <path d="M -20 -15 Q -10 -5 0 0 Q 10 -5 20 -15" fill="none" stroke="#FBBF24" stroke-width="2.5" />
        <path d="M -25 10 Q -10 5 0 0 Q 10 5 25 10" fill="none" stroke="#FBBF24" stroke-width="2.5" />
      </g>

      <!-- Yellow Stitching Needle & Thread -->
      <path d="M 60 110 C 90 140, 110 130, 140 170" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4,2" />

      <!-- Text Overlay: CRAFTS -->
      <text x="122" y="270" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7" font-weight="700" letter-spacing="2" text-anchor="middle" opacity="0.85">HERITAGE</text>
      <text x="122" y="295" fill="#FFFFFF" font-family="Georgia, serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">CRAFTS</text>
    </g>
  </g>
</svg>
