<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3D141C" flood-opacity="0.08" />
    </filter>

    <!-- Golden Sun Icon Definition -->
    <g id="sunIcon">
      <circle cx="0" cy="0" r="10" fill="#F0B429" />
      <path d="M 0 -16 L 3 -11 L 0 -13 L -3 -11 Z
               M 11 -11 L 12 -5 L 9 -8 L 8 -12 Z
               M 16 0 L 11 3 L 13 0 L 11 -3 Z
               M 11 11 L 5 12 L 8 9 L 12 8 Z
               M 0 16 L -3 11 L 0 13 L 3 11 Z
               M -11 11 L -12 5 L -9 8 L -8 12 Z
               M -16 0 L -11 -3 L -13 0 L -11 3 Z
               M -11 -11 L -5 -12 L -8 -9 L -12 -8 Z" fill="#F0B429" />
    </g>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="780" fill="#FFFFFF" />

  <!-- ITEM 1: NILAMBAG PALACE -->
  <g transform="translate(0, 30)">
    <!-- Left: Nilambag Building Illustration Cutout -->
    <g transform="translate(180, 0)">
      <!-- Sun above building -->
      <use href="#sunIcon" x="220" y="20" />

      <!-- Palace Building Vector Art -->
      <g stroke="#4A3B32" stroke-width="1.2" fill="#F5F3EF">
        <!-- Main Facade -->
        <rect x="80" y="45" width="280" height="150" fill="#EAE6DF" />
        <!-- Upper Balcony Arcade -->
        <path d="M 80 45 L 360 45 L 360 95 L 80 95 Z" fill="#DDD8CE" />
        <!-- Arches Upper -->
        <path d="M 100 95 L 100 65 Q 115 50 130 65 L 130 95" fill="#C2BBAE" />
        <path d="M 140 95 L 140 65 Q 155 50 170 65 L 170 95" fill="#C2BBAE" />
        <path d="M 180 95 L 180 65 Q 195 50 210 65 L 210 95" fill="#C2BBAE" opacity="0" />
        <path d="M 230 95 L 230 65 Q 245 50 260 65 L 260 95" fill="#C2BBAE" />
        <path d="M 270 95 L 270 65 Q 285 50 300 65 L 300 95" fill="#C2BBAE" />
        <path d="M 310 95 L 310 65 Q 325 50 340 65 L 340 95" fill="#C2BBAE" />

        <!-- Grand Central Entrance Arch -->
        <path d="M 190 195 L 190 120 Q 220 90 250 120 L 250 195 Z" fill="#FFFFFF" stroke="#3D141C" stroke-width="2" />

        <!-- Ground Floor Columns -->
        <rect x="90" y="105" width="12" height="90" fill="#BAB1A0" />
        <rect x="120" y="105" width="12" height="90" fill="#BAB1A0" />
        <rect x="150" y="105" width="12" height="90" fill="#BAB1A0" />
        <rect x="278" y="105" width="12" height="90" fill="#BAB1A0" />
        <rect x="308" y="105" width="12" height="90" fill="#BAB1A0" />
        <rect x="338" y="105" width="12" height="90" fill="#BAB1A0" />

        <!-- Side Flanking Wings -->
        <rect x="10" y="75" width="70" height="120" fill="#E2DDD2" />
        <rect x="360" y="75" width="70" height="120" fill="#E2DDD2" />
        <!-- Wing Windows -->
        <rect x="25" y="95" width="18" height="30" fill="#A89F90" />
        <rect x="50" y="95" width="18" height="30" fill="#A89F90" />
        <rect x="375" y="95" width="18" height="30" fill="#A89F90" />
        <rect x="400" y="95" width="18" height="30" fill="#A89F90" />

        <!-- Vintage Lamp posts -->
        <path d="M 70 195 L 70 150 M 65 150 L 75 150 M 67 145 L 73 145" stroke="#3D141C" />
        <path d="M 370 195 L 370 150 M 365 150 L 375 150 M 367 145 L 373 145" stroke="#3D141C" />
      </g>
    </g>

    <!-- Right: Text Content -->
    <g transform="translate(680, 50)">
      <text x="0" y="30" font-family="'Georgia', serif" font-size="32" fill="#3D141C" font-weight="400">Nilambag Palace</text>
      <text x="0" y="65" font-family="'Georgia', serif" font-size="24" fill="#4D222B" font-weight="600">નીલમબાગ પેલેસ</text>
      <text x="0" y="98" font-family="'Georgia', serif" font-size="14" fill="#827068" width="380">
        <tspan x="0" dy="0">A historic palace now running as a heritage</tspan>
        <tspan x="0" dy="20">hotel in the heart of the city.</tspan>
      </text>

      <!-- Read More Button -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="120" height="38" rx="6" fill="#4A1C24" />
        <text x="60" y="24" font-family="'Georgia', serif" font-size="13" fill="#F3D379" text-anchor="middle">Read more</text>
      </g>
    </g>
  </g>

  <!-- ITEM 2: GANGADERI -->
  <g transform="translate(0, 270)">
    <!-- Left: Text Content -->
    <g transform="translate(240, 50)">
      <text x="0" y="30" font-family="'Georgia', serif" font-size="32" fill="#3D141C" font-weight="400">Gangaderi</text>
      <text x="0" y="65" font-family="'Georgia', serif" font-size="24" fill="#4D222B" font-weight="600">ગંગાડેરી</text>
      <text x="0" y="95" font-family="'Georgia', serif" font-size="14" fill="#827068">The Taj Mahal of Bhavnagar</text>

      <!-- Read More Button -->
      <g transform="translate(0, 125)">
        <rect x="0" y="0" width="120" height="38" rx="6" fill="#4A1C24" />
        <text x="60" y="24" font-family="'Georgia', serif" font-size="13" fill="#F3D379" text-anchor="middle">Read more</text>
      </g>
    </g>

    <!-- Right: Gangaderi Pavilion Cutout -->
    <g transform="translate(660, 0)">
      <!-- Sun above dome -->
      <use href="#sunIcon" x="120" y="15" />

      <!-- White Marble Pavilion Structure -->
      <g stroke="#4A3B32" stroke-width="1.2" fill="#F9F8F5">
        <!-- Main Dome -->
        <path d="M 85 100 Q 120 40 155 100 Z" fill="#EAE6DF" />
        <path d="M 120 40 L 120 25" stroke="#3D141C" stroke-width="2" />

        <!-- Cupola Base -->
        <rect x="75" y="100" width="90" height="20" fill="#DFD9CD" />

        <!-- Pillars -->
        <rect x="60" y="120" width="120" height="15" fill="#D2CAB9" />
        <!-- Main Pavilion Pillars -->
        <rect x="65" y="135" width="10" height="70" fill="#C4BBAA" />
        <rect x="90" y="135" width="10" height="70" fill="#C4BBAA" />
        <rect x="115" y="135" width="10" height="70" fill="#C4BBAA" />
        <rect x="140" y="135" width="10" height="70" fill="#C4BBAA" />
        <rect x="165" y="135" width="10" height="70" fill="#C4BBAA" />

        <!-- Plinth / Stairs Base -->
        <rect x="40" y="205" width="160" height="20" fill="#E0D9CB" />
      </g>
    </g>
  </g>

  <!-- ITEM 3: SIR TAKHTSINHJI GENERAL HOSPITAL -->
  <g transform="translate(0, 520)">
    <!-- Left: Hospital Building Cutout -->
    <g transform="translate(180, 0)">
      <!-- Sun above dome -->
      <use href="#sunIcon" x="120" y="15" />

      <!-- Grand Victorian Hospital Building -->
      <g stroke="#4A3B32" stroke-width="1.2" fill="#F5F3EF">
        <!-- Main Central Dome -->
        <path d="M 90 80 Q 120 30 150 80 Z" fill="#D5CEBF" />
        <path d="M 120 30 L 120 18" stroke="#3D141C" stroke-width="2" />

        <!-- Left Dome -->
        <path d="M 30 110 Q 50 70 70 110 Z" fill="#D5CEBF" />
        <!-- Right Dome -->
        <path d="M 170 110 Q 190 70 210 110 Z" fill="#D5CEBF" />

        <!-- Main Facade -->
        <rect x="20" y="110" width="200" height="100" fill="#E6E0D3" />
        <!-- Arcade Windows -->
        <path d="M 40 130 Q 50 120 60 130 L 60 160 L 40 160 Z" fill="#A89E8D" />
        <path d="M 75 130 Q 85 120 95 130 L 95 160 L 75 160 Z" fill="#A89E8D" />
        <path d="M 110 130 Q 120 120 130 130 L 130 160 L 110 160 Z" fill="#A89E8D" />
        <path d="M 145 130 Q 155 120 165 130 L 165 160 L 145 160 Z" fill="#A89E8D" />
        <path d="M 180 130 Q 190 120 200 130 L 200 160 L 180 160 Z" fill="#A89E8D" />

        <rect x="10" y="210" width="220" height="15" fill="#C8C0B0" />
      </g>
    </g>

    <!-- Right: Text Content -->
    <g transform="translate(680, 40)">
      <text x="0" y="30" font-family="'Georgia', serif" font-size="28" fill="#3D141C" font-weight="400">Sir Takhtsinhji General</text>
      <text x="0" y="60" font-family="'Georgia', serif" font-size="28" fill="#3D141C" font-weight="400">Hospital</text>
      <text x="0" y="95" font-family="'Georgia', serif" font-size="22" fill="#4D222B" font-weight="600">સર તખતસિંહજી દવાખાનું</text>
      <text x="0" y="125" font-family="'Georgia', serif" font-size="14" fill="#827068">
        <tspan x="0" dy="0">As majestic as a palace, popularly known as</tspan>
        <tspan x="0" dy="20">Sir T Hospital</tspan>
      </text>
    </g>
  </g>

</svg>
